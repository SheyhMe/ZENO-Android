plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

dependencies {
    implementation platform('io.github.jan-tennert.supabase:bom:3.9.0')
    implementation 'io.github.jan-tennert.supabase:auth-kt'
    implementation 'io.github.jan-tennert.supabase:postgrest-kt'
    implementation 'io.ktor:ktor-client-android:3.6.0'
    testImplementation 'junit:junit:4.13.2'
    implementation 'io.elevenlabs:elevenlabs-android:0.13.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}

android {
    buildFeatures {
        buildConfig true
    }

    namespace 'com.zeno.assistant'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zeno.assistant'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.2'
        buildConfigField 'String', 'SUPABASE_URL', '"https://qpqryqncsvmrtlsosois.supabase.co"'
        buildConfigField 'String', 'SUPABASE_PUBLISHABLE_KEY', '"sb_publishable_lT0x2RGGZglbKl2jLYZF6A_OD4wTaeY"'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}