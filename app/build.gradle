plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

dependencies {
    implementation 'io.elevenlabs:elevenlabs-android:0.13.1'
}

android {
    namespace 'com.zeno.assistant'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zeno.assistant'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
} 
