name: Build ZENO APK
on:
  push:
    branches: [ main, zeno-v2, zeno-full-upgrade ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zeno-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Run Android lint
        run: gradle lintDebug
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb logcat -c
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.zeno.assistant/.MainActivity
            sleep 12
            adb shell pidof com.zeno.assistant
            if adb logcat -d -s AndroidRuntime:E | grep -q "FATAL EXCEPTION"; then
              echo "ZENO crashed during startup"
              exit 1
            fi
      - uses: actions/upload-artifact@v4
        with:
          name: ZENO-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
