name: Build ZENO APK
on:
  push:
    branches: [ main, zeno-v2, zeno-full-upgrade ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zeno-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Run Android lint
        run: gradle lintDebug
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb logcat -c
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.zeno.assistant/.MainActivity
            sleep 12
            adb shell pidof com.zeno.assistant
            if adb logcat -d -s AndroidRuntime:E | grep -q "FATAL EXCEPTION"; then
              echo "ZENO crashed during startup"
              exit 1
            fi
      - name: Verify deployed ZENO backend
        run: |
          url="https://zeno-private-backend-git-zeno-full-upgrade-seyhme-5727.vercel.app/api/chat"
          for attempt in $(seq 1 18); do
            status=$(curl -sS -o /tmp/zeno-health.json -w "%{http_code}" "$url" || true)
            if [ "$status" = "200" ] && grep -q '"status":"ok"' /tmp/zeno-health.json; then
              break
            fi
            if [ "$attempt" = "18" ]; then
              echo "ZENO backend health check failed"
              cat /tmp/zeno-health.json || true
              exit 1
            fi
            sleep 5
          done
          auth_status=$(curl -sS -o /tmp/zeno-auth.json -w "%{http_code}" -X POST "$url" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer invalid-test-token" \
            --data '{"messages":[{"role":"user","content":"health check"}]}')
          if [ "$auth_status" != "401" ]; then
            echo "ZENO backend auth guard returned $auth_status instead of 401"
            cat /tmp/zeno-auth.json || true
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ZENO-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
